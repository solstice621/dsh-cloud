name: DSH Cloud tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci
      - name: Upload core coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Real Docker runtime (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Build runtime from locked dependencies
        run: docker build --progress=plain -t dsh-cloud-runtime:0.1.3 -f deploy/runtime-images/Dockerfile .
      - name: Run real Runner, Executor and DSH recovery scenarios
        run: npm run test:docker
